<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oila akademiyasi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        .slide-up { animation: slideUp 0.4s ease-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* GPS Animations */
        @keyframes ping-slow {
            0% { transform: scale(1); opacity: 0.8; }
            75%, 100% { transform: scale(2); opacity: 0; }
        }
        .animate-ping-slow { animation: ping-slow 3s cubic-bezier(0, 0, 0.2, 1) infinite; }
        
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="app"></div>

    <script>
        // --- DATA ---
        const coursesData = [
            {
                id: 1, title: "Psixologiya, etika va muloqot madaniyati", iconName: "heart",
                color: "bg-rose-100 text-rose-600",
                image: "https://images.unsplash.com/photo-1529156069898-49953eb1b5ce?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                description: "Er-xotin munosabatlari, ziddiyatlarni hal qilish (mediatsiya), qaynona-kelin munosabatlari sirlari.",
                progress: 100,
                lessons: [
                    { title: "Er va xotin o'rtasidagi o'zaro hurmat va ishonch", duration: "15 daqiqa", isPremium: false },
                    { title: "Oila ichidagi nizolarni tinch yo'l bilan hal qilish", duration: "20 daqiqa", isPremium: false },
                    { title: "Chuqurlashtirilgan: Ziddiyatlarni hal qilish (Mediatsiya)", duration: "35 daqiqa", isPremium: true },
                    { title: "Qaynona va kelin munosabatlarining psixologiyasi", duration: "25 daqiqa", isPremium: true }
                ]
            },
            {
                id: 2, title: "Moliyaviy va huquqiy savodxonlik", iconName: "scale",
                color: "bg-blue-100 text-blue-600",
                image: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                description: "Oila byudjetini rejalashtirish, nikoh shartnomasi, mulkiy huquqlar va majburiyatlar.",
                progress: 75,
                lessons: [
                    { title: "Oila byudjetini to'g'ri rejalashtirish va jamg'arma yaratishdir", duration: "20 daqiqa", isPremium: false },
                    { title: "Qarzlardan qochish va iqtisodiy mustaqillikka erishish", duration: "15 daqiqa", isPremium: false },
                    { title: "Chuqurlashtirilgan: Nikoh shartnomasi va uning huquqiy asosi", duration: "40 daqiqa", isPremium: true },
                    { title: "Aliment, mulkiy huquqlar va er-xotinning qonuniy majburiyatlari", duration: "25 daqiqa", isPremium: true }
                ]
            },
            {
                id: 3, title: "Tibbiy va reproduktiv salomatlik", iconName: "stethoscope",
                color: "bg-emerald-100 text-emerald-600",
                image: "https://images.unsplash.com/photo-1584515933487-779824d29309?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                description: "Sog'lom turmush tarzi, genetika, qarindoshlar o'rtasidagi nikoh xavfi va bola parvarishi.",
                progress: 0,
                lessons: [
                    { title: "Oilada sog'lom turmush tarzini shakllantirish", duration: "15 daqiqa", isPremium: false },
                    { title: "Chaqaloq parvarishi va birinchi yordam gigiyenasi", duration: "20 daqiqa", isPremium: false },
                    { title: "Chuqurlashtirilgan: Genetika va qarindoshlar nikohi xavflari", duration: "35 daqiqa", isPremium: true },
                    { title: "Homiladorlikka tayyorgarlik va reproduktiv salomatlik", duration: "30 daqiqa", isPremium: true }
                ]
            },
            {
                id: 4, title: "Ma'naviyat va qadriyatlar", iconName: "book-open",
                color: "bg-amber-100 text-amber-600",
                image: "https://images.unsplash.com/photo-1491841550275-ad7854e35ca6?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
                description: "Milliy an'analar, diniy va axloqiy tarbiya asoslari, kitobning oiladagi o'rni.",
                progress: 0,
                lessons: [
                    { title: "O'zbek oilasining milliy va an'anaviy qadriyatlari", duration: "20 daqiqa", isPremium: false },
                    { title: "Bola tarbiyasida oila va jamiyatning hamkorligi", duration: "15 daqiqa", isPremium: false },
                    { title: "Chuqurlashtirilgan: Oilada axloqiy va ruhiy tarbiya", duration: "30 daqiqa", isPremium: true },
                    { title: "Oilaviy kitobxonlik va uning farzand kelajagidagi o'rni", duration: "20 daqiqa", isPremium: true }
                ]
            }
        ];

        const examQuestions = [
            {
                id: 1, question: "Qaynona va kelin o'rtasida tushunmovchilik kelib chiqqanda eng to'g'ri yechim nima?",
                options: [
                    "Darhol ota-onaga qo'ng'iroq qilib shikoyat qilish",
                    "O'zaro hurmatni saqlagan holda ochiq va xotirjam muloqot qilish",
                    "Bir-biri bilan umuman gaplashmay qo'yish",
                    "Qo'shnilarga vaziyatni aytib berish"
                ], answer: 1
            },
            {
                id: 2, question: "Qarindoshlar o'rtasidagi nikohning eng katta xavfi nimada?",
                options: [
                    "To'y xarajatlarining ko'payib ketishida",
                    "Oilaviy sirlarning tashqariga chiqishida",
                    "Tug'ilajak farzandlarda genetik kasalliklar uchrash ehtimolining yuqoriligida",
                    "Qudalar o'rtasida tez-tez janjal bo'lishida"
                ], answer: 2
            },
            {
                id: 3, question: "Oila byudjetini boshqarishda 'Xavfsizlik yostig'i' (jamg'arma) nima uchun kerak?",
                options: [
                    "Faqat to'y va ma'rakalar qilish uchun",
                    "Kutilmagan favqulodda xarajatlar (kasallik, ishsizlik) yuzaga kelganda moliyaviy qiyinchilikka tushmaslik uchun",
                    "Qo'shnilarga maqtanib yurish uchun",
                    "Har oy yangi kiyim sotib olish uchun"
                ], answer: 1
            }
        ];

        // --- STATE ---
        let state = {
            authStage: 'app', // 'login', 'otp', 'app'
            currentView: 'admin', // 'home', 'admin', 'gps', 'course', 'payment', 'exam', 'certificate'
            userType: 'admin', // 'admin', 'groom', 'bride', 'public'
            phone: '+998 90 123 45 67',
            otp: '',
            isPaid: false,
            selectedCourseId: null,
            examAnswers: {},
            showResult: false,
            score: 0,
            gpsEnabled: false,
            distance: 4.2
        };

        let gpsIntervalId = null;

        // --- HELPERS ---
        function getMyName() {
            return state.userType === 'groom' ? 'Alisher' : state.userType === 'bride' ? 'Aziza' : 'Foydalanuvchi';
        }
        function getPartnerName() {
            return state.userType === 'groom' ? 'Aziza' : state.userType === 'bride' ? 'Alisher' : '';
        }
        function isCouple() {
            return state.userType === 'groom' || state.userType === 'bride';
        }
        function getMyProgress() { return state.userType === 'groom' ? 85 : state.userType === 'bride' ? 45 : 0; }
        function getPartnerProgress() { return state.userType === 'groom' ? 45 : state.userType === 'bride' ? 85 : 0; }

        // --- ACTIONS ---
        window.setAuthStage = (stage) => { state.authStage = stage; render(); };
        window.setUserType = (type) => { 
            state.userType = type; 
            state.currentView = (type === 'admin') ? 'admin' : 'home';
            state.isPaid = false; 
            render(); 
        };
        window.setCurrentView = (view) => { state.currentView = view; render(); };
        window.setPhone = (val) => { state.phone = val; };
        window.setOtp = (val) => { state.otp = val; };
        
        window.handleLogin = (e) => {
            e.preventDefault();
            if (state.phone.length > 8) { window.setAuthStage('otp'); }
        };
        
        window.handleVerifyOtp = (e) => {
            e.preventDefault();
            window.setAuthStage('app');
        };

        window.logout = () => {
            state.authStage = 'login';
            state.phone = '';
            state.otp = '';
            state.currentView = 'home';
            state.isPaid = false;
            render();
        };

        window.handleCourseClick = (id) => {
            state.selectedCourseId = id;
            state.currentView = 'course';
            render();
        };

        window.handleStartExam = () => {
            if (isCouple() && !state.isPaid) {
                state.currentView = 'payment';
            } else {
                state.currentView = 'exam';
            }
            render();
        };

        window.setExamAnswer = (qIndex, oIndex) => {
            state.examAnswers[qIndex] = oIndex;
            render(); // Re-render to update radio buttons state
        };

        window.handleExamSubmit = () => {
            let correct = 0;
            examQuestions.forEach((q, index) => {
                if (state.examAnswers[index] === q.answer) correct++;
            });
            state.score = correct;
            state.showResult = true;
            render();
        };

        window.retryExam = () => {
            state.showResult = false;
            state.examAnswers = {};
            render();
        };

        window.handlePaymentSubmit = (e) => {
            e.preventDefault();
            // Simulate processing
            const btn = document.getElementById('payment-btn');
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Kuting...';
            lucide.createIcons();
            
            setTimeout(() => {
                state.isPaid = true;
                state.currentView = 'home';
                alert("To'lov muvaffaqiyatli amalga oshirildi!");
                render();
            }, 1500);
        };

        window.toggleGps = () => {
            state.gpsEnabled = !state.gpsEnabled;
            render();
        };

        window.navigateHome = () => {
            state.currentView = state.userType === 'admin' ? 'admin' : 'home';
            state.selectedCourseId = null;
            state.showResult = false;
            state.examAnswers = {};
            render();
        };

        // Handle GPS interval
        function manageGpsInterval() {
            if (state.currentView === 'gps' && state.gpsEnabled) {
                if (!gpsIntervalId) {
                    gpsIntervalId = setInterval(() => {
                        state.distance = Math.max(0, state.distance - 0.1);
                        // Re-render only GPS part to be efficient, but full render is fine for prototype
                        render(); 
                    }, 3000);
                }
            } else {
                if (gpsIntervalId) {
                    clearInterval(gpsIntervalId);
                    gpsIntervalId = null;
                }
            }
        }

        // --- RENDER FUNCTIONS ---

        function renderLogin() {
            return `
            <div class="min-h-screen bg-slate-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8 fade-in">
                <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
                    <div class="mx-auto bg-emerald-600 w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg mb-4">
                        <i data-lucide="shield-check" class="w-10 h-10 text-white"></i>
                    </div>
                    <h2 class="text-3xl font-extrabold text-slate-900">Oila akademiyasi</h2>
                    <p class="mt-2 text-sm text-slate-600">FXDYO tasdiqlagan ta'lim platformasi</p>
                </div>

                <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
                    <div class="bg-white py-8 px-4 shadow-xl border border-slate-100 sm:rounded-3xl sm:px-10">
                        ${state.authStage === 'login' ? `
                            <form class="space-y-6" onsubmit="window.handleLogin(event)">
                                <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                                    <button type="button" onclick="window.setUserType('groom')" class="flex-1 text-sm font-medium py-2 rounded-lg transition-all ${isCouple() ? 'bg-white shadow-sm text-emerald-700' : 'text-slate-500 hover:text-slate-700'}">Oila quruvchilar (FXDYO)</button>
                                    <button type="button" onclick="window.setUserType('public')" class="flex-1 text-sm font-medium py-2 rounded-lg transition-all ${state.userType === 'public' ? 'bg-white shadow-sm text-emerald-700' : 'text-slate-500 hover:text-slate-700'}">Erkin tinglovchi</button>
                                </div>
                                ${isCouple() ? `
                                <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs p-3 rounded-xl mb-4 flex items-start space-x-2">
                                    <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
                                    <p>Shaxsiy telefon raqamingiz orqali profilingizga kiring. Tizim sizni FXDYO bazasi orqali juftingiz bilan avtomatik bog'laydi.</p>
                                </div>` : ''}
                                <div>
                                    <label class="block text-sm font-medium text-slate-700">Telefon raqamingiz</label>
                                    <div class="mt-2 relative rounded-xl shadow-sm">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i data-lucide="smartphone" class="h-5 w-5 text-slate-400"></i>
                                        </div>
                                        <input type="tel" oninput="window.setPhone(this.value)" value="${state.phone}" class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm bg-slate-50" placeholder="+998 90 123 45 67" required />
                                    </div>
                                </div>
                                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 transition-colors">SMS kodni olish</button>
                            </form>
                        ` : `
                            <form class="space-y-6 fade-in" onsubmit="window.handleVerifyOtp(event)">
                                <div class="text-center mb-6">
                                    <p class="text-sm text-slate-600"><span class="font-bold text-slate-900">${state.phone}</span> raqamiga yuborilgan 4 xonali kodni kiriting.</p>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700">SMS Kod</label>
                                    <div class="mt-2 relative rounded-xl shadow-sm">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i data-lucide="key-round" class="h-5 w-5 text-slate-400"></i>
                                        </div>
                                        <input type="text" maxlength="4" oninput="window.setOtp(this.value)" value="${state.otp}" class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl focus:ring-emerald-500 focus:border-emerald-500 text-center tracking-[0.5em] font-bold text-lg bg-slate-50" placeholder="••••" required />
                                    </div>
                                </div>
                                <div class="flex flex-col space-y-3">
                                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 transition-colors">Tizimga kirish</button>
                                    <button type="button" onclick="window.setAuthStage('login')" class="w-full flex justify-center py-3 px-4 border border-slate-300 rounded-xl shadow-sm text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 transition-colors">Raqamni o'zgartirish</button>
                                </div>
                            </form>
                        `}
                    </div>
                </div>
            </div>`;
        }

        function renderHeader() {
            return `
            <header class="bg-white border-b sticky top-0 z-20 shadow-sm">
                <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    <div class="flex items-center space-x-2 cursor-pointer" onclick="window.navigateHome()">
                        <div class="bg-emerald-600 p-2 rounded-lg">
                            <i data-lucide="shield-check" class="w-5 h-5 md:w-6 md:h-6 text-white"></i>
                        </div>
                        <div>
                            <h1 class="text-lg md:text-xl font-bold text-slate-900 leading-tight">Oila akademiyasi</h1>
                            <p class="text-[9px] md:text-[10px] text-slate-500 font-medium tracking-wide uppercase">
                                ${state.userType === 'admin' ? 'Boshqaruv Paneli' : isCouple() ? "FXDYO Majburiy Dastur" : "Erkin o'rganish"}
                            </p>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-3 md:space-x-6">
                        <select class="bg-slate-100 border-none text-xs font-bold text-slate-600 rounded-lg focus:ring-0 cursor-pointer p-2 outline-none" onchange="window.setUserType(this.value)">
                            <option value="admin" ${state.userType === 'admin' ? 'selected' : ''}>Admin Profil</option>
                            <option value="groom" ${state.userType === 'groom' ? 'selected' : ''}>Kuyov Profili (Alisher)</option>
                            <option value="bride" ${state.userType === 'bride' ? 'selected' : ''}>Kelin Profili (Aziza)</option>
                            <option value="public" ${state.userType === 'public' ? 'selected' : ''}>Erkin Profil</option>
                        </select>

                        ${isCouple() ? `
                        <button onclick="window.setCurrentView('gps')" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${state.currentView === 'gps' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600'}">
                            <i data-lucide="map-pin" class="w-4 h-4"></i>
                            <span class="hidden md:inline">Lokator</span>
                        </button>` : ''}

                        ${state.userType === 'admin' ? `
                        <button onclick="window.setCurrentView('admin')" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${state.currentView === 'admin' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600 hover:bg-emerald-50 hover:text-emerald-600'}">
                            <i data-lucide="bar-chart-2" class="w-4 h-4"></i>
                            <span class="hidden md:inline">Statistika</span>
                        </button>` : ''}

                        <div class="flex items-center space-x-3 cursor-pointer group" onclick="window.logout()">
                            <div class="hidden md:flex flex-col items-end">
                                <span class="text-sm font-medium text-slate-900 group-hover:text-emerald-600 transition-colors">
                                    ${state.userType === 'admin' ? 'Asosiy Administrator' : isCouple() ? getMyName() : 'Foydalanuvchi'}
                                </span>
                                <span class="text-xs text-emerald-600 font-medium">Chiqish</span>
                            </div>
                            <div class="w-9 h-9 md:w-10 md:h-10 bg-slate-100 rounded-full flex items-center justify-center border-2 border-emerald-500 overflow-hidden">
                                <i data-lucide="user" class="w-5 h-5 text-slate-500 group-hover:text-emerald-600 transition-colors"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </header>`;
        }

        function renderAdminDashboard() {
            return `
            <div class="space-y-6 slide-up">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-2xl font-bold text-slate-900">Platforma Statistikasi</h2>
                    <button class="flex items-center space-x-2 text-emerald-600 bg-emerald-50 px-4 py-2 rounded-xl font-medium hover:bg-emerald-100 transition-colors">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                        <span>Sozlamalar</span>
                    </button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center mb-4">
                            <i data-lucide="users" class="w-6 h-6"></i>
                        </div>
                        <p class="text-slate-500 text-sm font-medium">Jami o'quvchilar</p>
                        <h3 class="text-3xl font-bold text-slate-900 mt-1">12,450</h3>
                        <p class="text-emerald-500 text-xs font-bold mt-2">+124 bugun</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center mb-4">
                            <i data-lucide="heart" class="w-6 h-6"></i>
                        </div>
                        <p class="text-slate-500 text-sm font-medium">Oila qurayotgan juftliklar</p>
                        <h3 class="text-3xl font-bold text-slate-900 mt-1">5,820</h3>
                        <p class="text-emerald-500 text-xs font-bold mt-2">+45 bugun</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center mb-4">
                            <i data-lucide="award" class="w-6 h-6"></i>
                        </div>
                        <p class="text-slate-500 text-sm font-medium">Berilgan sertifikatlar</p>
                        <h3 class="text-3xl font-bold text-slate-900 mt-1">4,112</h3>
                        <p class="text-emerald-500 text-xs font-bold mt-2">+12 bugun</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center mb-4">
                            <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                        </div>
                        <p class="text-slate-500 text-sm font-medium">O'rtacha o'zlashtirish</p>
                        <h3 class="text-3xl font-bold text-slate-900 mt-1">87%</h3>
                        <p class="text-emerald-500 text-xs font-bold mt-2">Yaxshi ko'rsatkich</p>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mt-8">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                        <h3 class="text-lg font-bold text-slate-900">Kurslarni boshqarish</h3>
                        <button onclick="window.setCurrentView('home')" class="text-sm text-emerald-600 font-medium hover:underline">
                            Kurslarni o'quvchi sifatida ko'rish
                        </button>
                    </div>
                    <div class="divide-y divide-slate-100">
                        ${coursesData.map(course => `
                            <div class="p-4 px-6 flex items-center justify-between hover:bg-slate-50 transition-colors">
                                <div class="flex items-center space-x-4">
                                    <div class="p-2 rounded-lg ${course.color}">
                                        <i data-lucide="${course.iconName}" class="w-5 h-5"></i>

                                    <input type="text" placeholder="MM/YY" class="w-full border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 bg-slate-50 outline-none transition-all text-center" required />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Karta egasi</label>
                                    <input type="text" placeholder="ISMI SHARIFI" class="w-full border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 bg-slate-50 outline-none transition-all uppercase" required />
                                </div>
                            </div>
                            
                            <div class="pt-4">
                                <button type="submit" id="payment-btn" class="w-full py-4 rounded-xl font-bold text-white text-lg shadow-lg flex justify-center items-center gap-2 transition-transform hover:scale-[1.02] active:scale-[0.98] ${isCouple() ? 'bg-amber-500 hover:bg-amber-600 shadow-amber-500/30' : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-600/30'}">
                                    <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                                    To'lovni tasdiqlash
                                </button>
                            </div>
                            <p class="text-center text-xs text-slate-400 mt-4 flex items-center justify-center gap-1">
                                <i data-lucide="shield-check" class="w-3 h-3"></i> To'lovlar xavfsiz himoyalangan
                            </p>
                        </form>
                    </div>
                </div>
            </div>`;
        }

        function renderGps() {
            return `
            <div class="max-w-4xl mx-auto slide-up">
                <button onclick="window.navigateHome()" class="flex items-center space-x-2 text-slate-500 hover:text-indigo-600 mb-6 font-medium transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Bosh sahifaga qaytish</span>
                </button>

                <div class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
                    <div class="bg-indigo-600 p-8 text-white text-center relative overflow-hidden">
                        <i data-lucide="map" class="w-16 h-16 mx-auto mb-4 opacity-20 absolute -left-4 -bottom-4 transform -rotate-12 scale-150"></i>
                        <div class="relative z-10">
                            <i data-lucide="navigation" class="w-10 h-10 mx-auto mb-3"></i>
                            <h2 class="text-3xl font-bold mb-2">Juftlik Lokatori</h2>
                            <p class="text-indigo-200 max-w-lg mx-auto text-sm">
                                Bu xizmat orqali bo'lajak turmush o'rtog'ingiz (${getPartnerName()}) qayerda ekanligini ko'rishingiz mumkin.
                            </p>
                        </div>
                    </div>
                    
                    <div class="p-8">
                        <div class="flex flex-col sm:flex-row items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-200 mb-8 gap-4">
                            <div class="flex items-center gap-3">
                                <div class="p-2 rounded-full ${state.gpsEnabled ? 'bg-indigo-100 text-indigo-600' : 'bg-slate-200 text-slate-500'}">
                                    <i data-lucide="map-pin" class="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-900">Lokatsiyani ulashish</h4>
                                    <p class="text-xs text-slate-500">Juflingiz sizning joylashuvingizni ko'ra oladi</p>
                                </div>
                            </div>
                            <button onclick="window.toggleGps()" type="button" class="relative inline-flex h-8 w-14 items-center rounded-full transition-colors focus:outline-none ${state.gpsEnabled ? 'bg-indigo-600' : 'bg-slate-300'}">
                                <span class="inline-block h-6 w-6 transform rounded-full bg-white transition duration-200 ease-in-out ${state.gpsEnabled ? 'translate-x-7' : 'translate-x-1'}"></span>
                            </button>
                        </div>

                        <div class="bg-slate-100 rounded-3xl h-80 relative flex items-center justify-center overflow-hidden border border-slate-200">
                            ${!state.gpsEnabled ? `
                                <div class="text-center z-10 px-4">
                                    <i data-lucide="radar" class="w-16 h-16 text-slate-300 mx-auto mb-4"></i>
                                    <p class="text-slate-500 font-medium">Xizmat faol emas. Lokatsiyani ulashishni yoqing.</p>
                                </div>
                            ` : `
                                <div class="absolute inset-0 z-0" style="background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; opacity: 0.5;"></div>
                                <div class="absolute w-[400px] h-[400px] rounded-full border border-indigo-200/50 flex items-center justify-center">
                                    <div class="absolute w-[300px] h-[300px] rounded-full border border-indigo-300/50"></div>
                                    <div class="absolute w-[200px] h-[200px] rounded-full border border-indigo-400/50 bg-indigo-50/20"></div>
                                    <div class="absolute w-[100px] h-[100px] rounded-full border-2 border-indigo-500/50 bg-indigo-100/50 animate-ping-slow opacity-20"></div>
                                </div>
  
                                <div class="absolute z-10 flex flex-col items-center group">
                                    <div class="bg-blue-600 text-white p-2 rounded-full shadow-lg relative z-10 border-2 border-white">
                                        <i data-lucide="user" class="w-5 h-5"></i>
                                    </div>
                                    <div class="mt-1 bg-white px-2 py-0.5 rounded text-[10px] font-bold shadow-sm border border-slate-100 text-slate-700">Men (${getMyName()})</div>
                                </div>

                                <div class="absolute z-10 flex flex-col items-center transition-all duration-1000 ease-in-out" style="transform: translate(${state.distance * 20}px, -${state.distance * 15}px)">
                                    <div class="bg-rose-500 text-white p-2 rounded-full shadow-lg relative z-10 border-2 border-white animate-bounce">
                                        <i data-lucide="heart" class="w-5 h-5"></i>
                                    </div>
                                    <div class="mt-1 bg-white px-2 py-0.5 rounded text-[10px] font-bold shadow-sm border border-slate-100 text-slate-700">${getPartnerName()}</div>
                                </div>

                                <div class="absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur-md rounded-xl p-4 shadow-lg border border-indigo-100 flex items-center justify-between z-20">
                                    <div>
                                        <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Hozirgi Masofa</p>
                                        <p class="text-2xl font-black text-indigo-700 font-mono">${state.distance.toFixed(1)} km</p>
                                    </div>
                                    <div class="text-right">
                                        <div class="flex items-center space-x-1 justify-end text-emerald-600">
                                            <span class="relative flex h-3 w-3">
                                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                                <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                                            </span>
                                            <span class="text-xs font-bold uppercase">Jonli Kuzatuv</span>
                                        </div>
                                        <p class="text-xs text-slate-500 mt-1">${state.distance < 1 ? 'Juda yaqin!' : 'Yaqinlashmoqda...'}</p>
                                    </div>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderCertificate() {
            const pending = isCouple() && state.score === examQuestions.length && getPartnerProgress() < 100;
            return `
            <div class="max-w-4xl mx-auto slide-up">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="window.navigateHome()" class="flex items-center space-x-2 text-slate-500 hover:text-emerald-600 font-medium transition-colors">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span>Bosh sahifaga</span>
                    </button>
                    <button class="flex items-center space-x-2 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 px-4 py-2 rounded-lg font-medium transition-colors">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span>PDF yuklab olish</span>
                    </button>
                </div>

                <div class="bg-white p-2 md:p-4 rounded shadow-2xl border border-slate-200 relative">
                    ${pending ? `
                    <div class="absolute inset-0 z-50 bg-white/60 backdrop-blur-[2px] flex items-center justify-center rounded">
                        <div class="bg-amber-100 text-amber-900 px-6 py-4 rounded-xl font-bold border-2 border-amber-300 transform -rotate-12 text-xl shadow-xl flex items-center gap-2">
                            <i data-lucide="lock" class="w-6 h-6"></i> KUTILMOQDA (Juftingiz tugatmagan)
                        </div>
                    </div>` : ''}
                    
                    <div class="border-[12px] border-emerald-800 p-8 md:p-16 relative bg-[#faf9f6] text-center bg-opacity-90 overflow-hidden">
                        <div class="absolute inset-0 opacity-[0.03] flex items-center justify-center pointer-events-none">
                            <i data-lucide="award" class="w-[500px] h-[500px]"></i>
                        </div>
                        
                        <div class="relative z-10 flex flex-col items-center">
                            <div class="flex items-center justify-center space-x-4 mb-8">
                                <i data-lucide="shield-check" class="w-16 h-16 text-emerald-700"></i>
                                <div class="text-left border-l-2 border-emerald-700 pl-4">
                                    <p class="text-xs md:text-sm font-bold text-slate-800 uppercase tracking-widest">O'zbekiston Respublikasi</p>
                                    <p class="text-[10px] md:text-xs text-slate-600 font-medium uppercase tracking-wider">Adliya Vazirligi huzuridagi FXDYO</p>
                                </div>
                            </div>

                            <h1 class="text-4xl md:text-6xl font-serif text-emerald-900 mb-2 font-bold tracking-wider">SERTIFIKAT</h1>
                            <p class="text-slate-500 uppercase tracking-widest text-sm mb-12 border-b-2 border-emerald-200 pb-4 w-64 text-center">Nº MO-2026-08942</p>

                            <p class="text-lg md:text-xl text-slate-700 mb-4 font-serif">Ushbu sertifikat tasdiqlaydiki,</p>
                            
                            <h2 class="text-3xl md:text-5xl font-bold text-slate-900 mb-4 border-b-2 border-slate-300 pb-2 px-12 inline-block font-serif">
                                ${state.userType === 'bride' ? 'Azizova Aziza' : state.userType === 'groom' ? 'Alisherov Alisher' : 'Foydalanuvchi ishi-sharifi'}
                            </h2>
                            ${(isCouple() || state.userType === 'admin') ? `
                            <h2 class="text-3xl md:text-5xl font-bold text-slate-900 mb-8 border-b-2 border-slate-300 pb-2 px-12 inline-block font-serif">
                                ${state.userType === 'bride' ? 'Alisherov Alisher' : 'Azizova Aziza'}
                            </h2>` : ''}

                            <p class="text-lg md:text-xl text-slate-700 max-w-2xl mx-auto leading-relaxed mb-16 font-serif">
                                FXDYO organlari qoshidagi <strong>"Oila akademiyasi"</strong> o'quv dasturi doirasida psixologiya, huquq, tibbiyot va ma'naviyat bo'yicha oilaviy munosabatlarga tayyorlash maxsus kursini muvaffaqiyatli tamomlaganliklarini tasdiqlaydi.
                            </p>

                            <div class="w-full flex justify-between items-end px-4 md:px-16 mt-auto">
                                <div class="text-center">
                                    <div class="w-32 md:w-48 h-px bg-slate-800 mb-2"></div>
                                    <p class="text-sm font-bold text-slate-800">Direktor</p>
                                    <p class="text-xs text-slate-500">FXDYO Markaziy Bo'limi</p>
                                </div>
                                <div class="w-24 h-24 border-4 border-emerald-800 rounded-full flex items-center justify-center opacity-80 transform -rotate-12">
                                    <span class="text-emerald-800 font-bold text-xs uppercase text-center leading-tight">Rasmiy<br/>Muhr</span>
                                </div>
                                <div class="text-center">
                                    <div class="text-lg font-serif mb-1">${new Date().toLocaleDateString('uz-UZ')}</div>
                                    <div class="w-32 md:w-48 h-px bg-slate-800 mb-2"></div>
                                    <p class="text-sm font-bold text-slate-800">Sana</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // --- MAIN RENDER ---
        function render() {
            const app = document.getElementById('app');
            manageGpsInterval();

            if (state.authStage === 'login' || state.authStage === 'otp') {
                app.innerHTML = renderLogin();
            } else {
                let mainContent = '';
                switch (state.currentView) {
                    case 'admin': mainContent = renderAdminDashboard(); break;
                    case 'home': mainContent = renderHome(); break;
                    case 'course': mainContent = renderCourse(); break;
                    case 'exam': mainContent = renderExam(); break;
                    case 'payment': mainContent = renderPayment(); break;
                    case 'gps': mainContent = renderGps(); break;
                    case 'certificate': mainContent = renderCertificate(); break;
                    default: mainContent = renderHome(); break;
                }

                app.innerHTML = `
                    ${renderHeader()}
                    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        ${mainContent}
                    </main>
                `;
            }

            // Create Icons after rendering HTML
            lucide.createIcons();
        }

        // Initial Render
        render();

    </script>
</body>
</html>
